name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *" # 06:00 SGT nightly: upstream contract + live app regression
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Also run the real-AWS Terraform integration test (creates and destroys resources)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: outsystems-aws-iac

jobs:
  static-analysis:
    name: IaC - fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - run: tflint --init && tflint --recursive --format compact
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: outsystems-aws-iac
          framework: terraform
          config_file: outsystems-aws-iac/.checkov.yaml

  unit-tests:
    name: IaC - unit tests (mocked AWS)
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -backend=false -input=false
      - run: terraform test

  environment-policy:
    name: IaC - policy (${{ matrix.env }})
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, test, prod, lifetime]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -backend=false -input=false
      - run: terraform test -test-directory=tests/policy -var-file=environments/${{ matrix.env }}.tfvars

  integration-tests:
    name: IaC - integration (real AWS, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    needs: [unit-tests, environment-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -backend=false -input=false -test-directory=tests/integration
      - run: terraform test -test-directory=tests/integration -var="acm_certificate_arn=${{ secrets.TEST_ACM_CERTIFICATE_ARN }}"

  upstream-contract:
    name: data.gov.sg contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: pytest tests/contract -m contract
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}

  app-e2e:
    name: Live app - E2E (Playwright)
    if: github.event_name != 'pull_request' && vars.APP_BASE_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -m e2e --browser chromium --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
